name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y python3-pil fonts-dejavu-core stress-ng fio iputils-ping
      - name: Verify standalone entry point and regressions
        run: |
          python3 build.py
          git diff --exit-code -- check.sh
          bash -n check.sh
          python3 -m unittest discover -s tests -v
      - name: Hardware smoke test (no load)
        run: bash check.sh --modules cpu,memory,disk
      - name: Real short stress and disposable-file I/O tests
        run: |
          bash check.sh --modules cpu,memory --stress cpu,memory --duration 1 --workers 1 --cpu-load 10 --memory-mib 16 | tee /tmp/stress-check.txt
          grep -q 'Stress cpu: PASS' /tmp/stress-check.txt
          grep -q 'Stress memory: PASS' /tmp/stress-check.txt
          bash check.sh --modules disk --disk-bench --disk-dir /tmp --disk-mib 64 --duration 1 | tee /tmp/disk-check.txt
          grep -q 'randread 4k:' /tmp/disk-check.txt
          test -z "$(find /tmp -maxdepth 1 -name '.vps-inspector-*' -print -quit)"
      - name: Actual PNG export
        run: |
          bash check.sh --modules cpu,memory,disk --png /tmp/vps-inspector-report.png
          python3 -c "from PIL import Image; im=Image.open('/tmp/vps-inspector-report.png'); im.verify()"
      - name: Real network and public launch smoke test
        run: |
          bash check.sh --modules network -4 --target 127.0.0.1 --ping-count 2 --http-url https://github.com/ --download-url https://raw.githubusercontent.com/beiluoshimenxing/vps-inspector/main/check.sh --download-mib 1 | tee /tmp/network-check.txt
          grep -q ', 0% packet loss' /tmp/network-check.txt
          grep -q 'HTTP=200' /tmp/network-check.txt
          grep -q 'Received ' /tmp/network-check.txt
          bash <(curl -fsSL https://raw.githubusercontent.com/beiluoshimenxing/vps-inspector/main/check.sh) --modules cpu,memory
